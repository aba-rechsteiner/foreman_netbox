name: JavaScript test

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.ref_name }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test:
    name: JavaScript
    strategy:
      fail-fast: false
      matrix:
        foreman:
          - "develop"
          - "5.0-stable"
    uses: theforeman/actions/.github/workflows/foreman_plugin_js.yml@v1
    with:
      plugin: foreman_netbox
      foreman_version: ${{ matrix.foreman }}
